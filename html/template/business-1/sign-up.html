<body>

    <div class="sign-page-container">
        <div class="sign-page-form">
            <div class="sign-page-top">
                <img class="img-fluid" src="static/picture/logo.png" alt="img">
            </div>
            <div class="sign-page-middle">
                <h2>Create an account</h2>
                <form>
                    <div class="sign-form-container">
                        <label class="sign-label">Username</label>
                        <input class="sign-input" type="text" placeholder="Username">
                    </div>
                    <div class="sign-form-container">
                        <label class="sign-label">Email</label>
                        <input class="sign-input" type="email" placeholder="Email">
                    </div>
                    <div class="sign-form-container">
                        <label class="sign-label">Password</label>
                        <input class="sign-input" type="password" placeholder="Password">
                    </div>
                    <div class="sign-form-container">
                        <label class="sign-label">Confirm Password</label>
                        <input class="sign-input" type="password" placeholder="Confirm Password">
                    </div>
                    <div class="sign-form-container">
                        <button class="theme-btn btn-main" type="button">Sign up</button>
                    </div>
                </form>
            </div>
            <div class="sign-page-bottom">
                <p>Already have an account? <a href="sign-in.html">Sign in</a></p>
            </div>
        </div>
    </div>
