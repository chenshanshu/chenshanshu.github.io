<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>1寸证件照排版（小米1S 6寸/3寸相纸）</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:20px auto;padding:0 16px}
.container{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{border:1px solid #ddd;padding:16px;border-radius:8px}
#previewCanvas{border:1px solid #ccc;max-width:100%;}
/* 排版预览按容器宽度缩放显示，实际像素仍为300DPI */
#layoutCanvas{border:1px solid #ccc;width:100%;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input[type=file]{margin:10px 0}
button,select{padding:8px 14px;margin:4px;cursor:pointer}
.info{background:#eef6ff;padding:12px;border-radius:6px;margin:12px 0;font-size:14px}
.tip{color:#999;font-size:12px;text-align:right;margin-top:6px}
</style>
</head>
<body>
<h2>1寸证件照排版｜小米照片打印机1S</h2>
<div class="info">
标准1寸：25mm × 35mm，300DPI<br>
6寸相纸：152mm × 102mm（横向），一页 8 张（4列×2行）<br>
3寸相纸：89mm × 64mm（横向），一页 3 张（3列×1行）
</div>
<div class="container">
<div class="card">
<h3>1.上传照片并裁剪预览</h3>
<input type="file" id="fileInput" accept="image/*">
<div>
<p>预览一寸照：</p>
<canvas id="previewCanvas"></canvas>
</div>
</div>
<div class="card">
<h3>2.排版预览 & 下载</h3>
<label>相纸：
  <select id="paperSelect">
    <option value="6">6寸（8张）</option>
    <option value="3">3寸（3张）</option>
  </select>
</label>
<button id="makeLayout">生成排版图</button>
<button id="downloadBtn">下载排版图片</button>
<div>
<p id="layoutTitle">整页预览：</p>
<canvas id="layoutCanvas"></canvas>
<p class="tip" id="paperTip"></p>
</div>
</div>
</div>

<script>
// 打印分辨率 300DPI
const DPI = 300;
// 1寸证件照尺寸 mm
const PHOTO_W_MM = 25;
const PHOTO_H_MM = 35;

/**
 * 相纸配置（均为横向）：宽高 mm、列数、行数
 * 照片在相纸内按行列均匀分布，四周和照片间留白相等
 */
const PAPERS = {
  '6': { name: '6寸', w: 152, h: 102, cols: 4, rows: 2 },
  '3': { name: '3寸', w: 89, h: 64, cols: 3, rows: 1 }
};

// mm 转像素
function mm2px(mm){
  return Math.round(mm / 25.4 * DPI);
}
const photoW = mm2px(PHOTO_W_MM);
const photoH = mm2px(PHOTO_H_MM);

const previewCanvas = document.getElementById('previewCanvas');
const previewCtx = previewCanvas.getContext('2d');
const layoutCanvas = document.getElementById('layoutCanvas');
const layoutCtx = layoutCanvas.getContext('2d');
const paperSelect = document.getElementById('paperSelect');

// 是否已上传并裁剪好照片
let hasPhoto = false;

/**
 * 获取当前选中的相纸配置
 */
function currentPaper(){
  return PAPERS[paperSelect.value];
}

/**
 * 按当前相纸初始化画布尺寸并铺白底
 */
function resetLayoutCanvas(){
  const paper = currentPaper();
  layoutCanvas.width = mm2px(paper.w);
  layoutCanvas.height = mm2px(paper.h);
  layoutCtx.fillStyle = '#ffffff';
  layoutCtx.fillRect(0, 0, layoutCanvas.width, layoutCanvas.height);
  document.getElementById('layoutTitle').textContent = `${paper.name}整页预览：`;
  document.getElementById('paperTip').textContent =
    `*请使用${paper.name}相纸打印（${paper.w}mm × ${paper.h}mm）`;
}

// 上传图片
document.getElementById('fileInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = ()=>{
    // 居中裁剪为一寸比例 25:35
    const targetRatio = PHOTO_W_MM / PHOTO_H_MM;
    let sx, sy, sw, sh;
    const imgRatio = img.width / img.height;
    if(imgRatio > targetRatio){
      sw = img.height * targetRatio;
      sh = img.height;
      sx = (img.width - sw) / 2;
      sy = 0;
    }else{
      sw = img.width;
      sh = img.width / targetRatio;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    previewCanvas.width = photoW;
    previewCanvas.height = photoH;
    previewCtx.drawImage(img, sx, sy, sw, sh, 0, 0, photoW, photoH);
    URL.revokeObjectURL(img.src);
    hasPhoto = true;
    // 上传后自动生成排版
    makeLayout();
  };
};

/**
 * 生成排版：照片在横向相纸中水平、垂直均匀分布，并绘制虚线裁切框
 */
function makeLayout(){
  resetLayoutCanvas();
  if(!hasPhoto) return;
  const paper = currentPaper();
  const W = layoutCanvas.width;
  const H = layoutCanvas.height;
  // 均分剩余空间作为边距/间距
  const gapX = (W - paper.cols * photoW) / (paper.cols + 1);
  const gapY = (H - paper.rows * photoH) / (paper.rows + 1);

  layoutCtx.strokeStyle = '#bbbbbb';
  layoutCtx.lineWidth = 2;
  layoutCtx.setLineDash([12, 8]);

  for(let r = 0; r < paper.rows; r++){
    for(let c = 0; c < paper.cols; c++){
      const px = Math.round(gapX + c * (photoW + gapX));
      const py = Math.round(gapY + r * (photoH + gapY));
      layoutCtx.drawImage(previewCanvas, px, py, photoW, photoH);
      // 裁切参考线
      layoutCtx.strokeRect(px - 1, py - 1, photoW + 2, photoH + 2);
    }
  }
  layoutCtx.setLineDash([]);
}

document.getElementById('makeLayout').onclick = ()=>{
  if(!hasPhoto){ alert('请先上传照片'); return; }
  makeLayout();
};

// 切换相纸后立即重新排版
paperSelect.onchange = makeLayout;

// 下载（普通 canvas 使用 toBlob）
document.getElementById('downloadBtn').onclick = ()=>{
  if(!hasPhoto){ alert('请先上传照片'); return; }
  const paper = currentPaper();
  layoutCanvas.toBlob((blob)=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `一寸证件照_${paper.name}排版_小米打印机.jpg`;
    a.click();
    // 延迟释放，避免部分浏览器下载未开始就失效
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }, 'image/jpeg', 0.92);
};

// 初始化空白相纸
resetLayoutCanvas();
</script>
</body>
</html>
