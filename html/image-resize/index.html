<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片等比缩放</title>
<style>
:root{
  --primary:#4f6bff;
  --primary-hover:#3d58f0;
  --primary-bg:rgba(79,107,255,.1);
  --warn:#d97706;
  --text:#1f2329;
  --text-2:#6b7280;
  --border:#e5e7eb;
  --bg:#f4f6fb;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:32px 16px 48px;
  color:var(--text);
  background:var(--bg);
  font:14px/1.6 system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
.page{max-width:1100px;margin:0 auto}

/* 返回入口页 */
.back{display:inline-block;margin-bottom:16px;color:var(--text-2);text-decoration:none;transition:color .2s}
.back:hover{color:var(--primary)}

.header h1{margin:0 0 6px;font-size:24px}
.header p{margin:0 0 24px;color:var(--text-2)}

/* 左侧大图预览，右侧尺寸设置 */
.container{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.card{padding:20px;background:#fff;border:1px solid var(--border);border-radius:12px}
.card-title{margin:0 0 16px;font-size:16px}

/* ---------- 预览舞台 ---------- */
.viewer{overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:12px}
.stage{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  height:520px;
  padding:16px;
  /* 棋盘格背景，便于识别透明区域 */
  background:repeating-conic-gradient(#2a2e37 0 25%,#1f2229 0 50%) 0 0/20px 20px;
}
.stage.is-dragover::after{
  content:'';position:absolute;inset:12px;
  border:2px dashed var(--primary);border-radius:10px;
  background:rgba(79,107,255,.12);pointer-events:none;
}
/* 宽高由脚本按统一显示比例设置，原图与效果大小可直接对比 */
#stageImg{position:relative;z-index:1;display:none;max-width:100%;max-height:100%;object-fit:contain}
.stage.has-image #stageImg{display:block}

/* 缩放效果模式下用虚线框标出原图范围 */
.origin-frame{
  position:absolute;top:50%;left:50%;
  display:none;
  border:1px dashed rgba(255,255,255,.55);
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.origin-frame span{
  position:absolute;left:0;bottom:100%;
  margin-bottom:4px;
  color:rgba(255,255,255,.7);font-size:12px;white-space:nowrap;
}
.origin-frame.is-show{display:block}
.stage.has-image .empty{display:none}

.empty{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:rgba(255,255,255,.75);cursor:pointer;transition:color .2s;
}
.empty:hover{color:#fff}
.empty svg{width:44px;height:44px;margin-bottom:4px;padding:10px;background:rgba(255,255,255,.08);border-radius:50%}
.empty p{margin:0;font-size:15px}
.empty span{font-size:12px;opacity:.6}

/* 舞台上的信息标签 */
.stage-badge{
  position:absolute;left:12px;bottom:12px;
  display:none;padding:2px 10px;
  color:#fff;font-size:12px;
  background:rgba(0,0,0,.6);border-radius:4px;
}
.stage.has-image .stage-badge{display:block}

/* 舞台右上角的更换图片按钮，有图片时显示 */
.change-btn{
  position:absolute;top:12px;right:12px;
  display:none;align-items:center;gap:6px;
  height:32px;padding:0 12px;
  color:#fff;font:inherit;font-size:13px;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:8px;
  cursor:pointer;backdrop-filter:blur(4px);transition:background .2s;
}
.change-btn:hover{background:rgba(0,0,0,.75)}
.change-btn svg{width:15px;height:15px}
.stage.has-image .change-btn{display:inline-flex}

/* 预览底部栏：原图 / 效果切换 */
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--border)}
.viewer-tip{color:var(--text-2);font-size:12px}

.segmented{display:inline-flex;padding:3px;background:#f0f2f7;border-radius:999px}
.segmented input{display:none}
.segmented label{padding:4px 16px;color:var(--text-2);font-weight:500;border-radius:999px;cursor:pointer;transition:color .2s,background-color .2s,box-shadow .2s}
.segmented input:checked+label{color:var(--primary);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- 设置面板 ---------- */
.info{margin:0 0 20px;padding:12px;font-size:13px;background:#f8f9fc;border-radius:8px}
.info div{display:flex;justify-content:space-between;gap:12px}
.info span{color:var(--text-2)}
.info b{overflow:hidden;font-weight:500;white-space:nowrap;text-overflow:ellipsis}

.field{margin-bottom:20px}
.field-label{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--text-2)}
.field-label b{color:var(--text);font-variant-numeric:tabular-nums}

/* 宽高输入，中间锁形图标表示等比 */
.size-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.size-input span{display:block;margin-bottom:4px;color:var(--text-2);font-size:12px}
.number{
  width:100%;height:36px;padding:0 10px;
  font:inherit;color:var(--text);
  border:1px solid var(--border);border-radius:8px;outline:none;
  transition:border-color .2s;
}
.number:focus{border-color:var(--primary)}
.lock{display:flex;align-items:center;justify-content:center;width:28px;height:36px;color:var(--primary)}
.lock svg{width:18px;height:18px}

input[type=range]{
  width:100%;height:4px;margin:0;
  background:#e5e7eb;border-radius:2px;outline:none;
  appearance:none;-webkit-appearance:none;
}
input[type=range]::-webkit-slider-thumb{
  width:16px;height:16px;
  background:#fff;border:2px solid var(--primary);border-radius:50%;
  cursor:pointer;-webkit-appearance:none;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:#fff;border:2px solid var(--primary);border-radius:50%;cursor:pointer}

.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.chip{
  padding:4px 0;
  color:var(--text-2);font:inherit;font-weight:500;
  background:#f3f4f6;border:1px solid transparent;border-radius:8px;
  cursor:pointer;transition:color .2s,background-color .2s,border-color .2s;
}
.chip:hover:not(:disabled){color:var(--primary)}
.chip.is-active{color:var(--primary);background:var(--primary-bg);border-color:rgba(79,107,255,.4)}

.warn{display:none;margin:-8px 0 16px;color:var(--warn);font-size:12px}
.warn.is-show{display:block}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;padding:0 16px;
  color:#fff;font:inherit;
  background:var(--primary);border:0;border-radius:8px;
  cursor:pointer;transition:background .2s;
}
.btn:hover:not(:disabled){background:var(--primary-hover)}
.btn svg{width:16px;height:16px}
.btn-block{grid-column:1/-1}
.btn-ghost{color:var(--text-2);background:#f3f4f6}
.btn-ghost:hover:not(:disabled){color:var(--primary);background:var(--primary-bg)}
button:disabled,input:disabled{opacity:.45;cursor:not-allowed}

@media (max-width:800px){
  .container{grid-template-columns:1fr}
  .stage{height:360px}
}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../index.html">← 返回工具列表</a>
  <header class="header">
    <h1>图片等比缩放</h1>
    <p>按宽度、高度或百分比等比缩放，只改尺寸不额外压缩，图片只在本地浏览器处理</p>
  </header>

  <div class="container">
    <!-- 大图预览 -->
    <section class="viewer">
      <div class="stage" id="stage">
        <div class="origin-frame" id="originFrame"><span>原图范围</span></div>
        <img id="stageImg" alt="预览">
        <div class="empty" id="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          <p>点击或拖拽图片到这里</p>
          <span>支持 JPG / PNG / WEBP</span>
        </div>
        <div class="stage-badge" id="stageBadge"></div>
        <button class="change-btn" id="changeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          更换图片
        </button>
      </div>
      <div class="viewer-bar">
        <div class="segmented" role="radiogroup" aria-label="预览模式">
          <input type="radio" name="view" id="viewOrigin" value="origin" checked><label for="viewOrigin">原图</label>
          <input type="radio" name="view" id="viewResult" value="result"><label for="viewResult">缩放效果</label>
        </div>
        <span class="viewer-tip" id="viewerTip">原图与效果按相同比例显示，可直接对比大小</span>
      </div>
    </section>

    <!-- 尺寸设置 -->
    <section class="card">
      <h3 class="card-title">尺寸设置</h3>
      <div class="info">
        <div><span>文件</span><b id="infoName">未选择</b></div>
        <div><span>原尺寸</span><b id="infoSize">—</b></div>
        <div><span>原大小</span><b id="infoBytes">—</b></div>
      </div>

      <div class="field">
        <div class="field-label">目标尺寸（px）</div>
        <div class="size-row">
          <label class="size-input"><span>宽度</span><input class="number" type="number" id="widthInput" min="1" disabled></label>
          <div class="lock" title="已锁定宽高比">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </div>
          <label class="size-input"><span>高度</span><input class="number" type="number" id="heightInput" min="1" disabled></label>
        </div>
      </div>

      <div class="field">
        <div class="field-label">缩放比例 <b id="percentText">100%</b></div>
        <input type="range" id="percentRange" min="1" max="200" value="100" disabled>
        <div class="presets" id="presets">
          <button class="chip" data-percent="25" disabled>25%</button>
          <button class="chip" data-percent="50" disabled>50%</button>
          <button class="chip" data-percent="75" disabled>75%</button>
          <button class="chip" data-percent="100" disabled>100%</button>
          <button class="chip" data-percent="150" disabled>150%</button>
          <button class="chip" data-percent="200" disabled>200%</button>
        </div>
      </div>
      <p class="warn" id="upscaleWarn">放大会让图片变模糊，建议不超过 100%</p>

      <div class="actions">
        <button class="btn btn-block" id="downloadBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-5-5m5 5 5-5M4 20h16"/></svg>
          下载图片
        </button>
        <button class="btn btn-ghost btn-block" id="resetBtn" disabled>重置为原尺寸</button>
      </div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
    </section>
  </div>
</div>

<script>
// 格式对应的文件扩展名
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
// 输出尺寸上限，避免超大画布导致浏览器崩溃
const MAX_SIDE = 10000;

const stage = document.getElementById('stage');
const stageImg = document.getElementById('stageImg');
const stageBadge = document.getElementById('stageBadge');
const fileInput = document.getElementById('fileInput');
const widthInput = document.getElementById('widthInput');
const heightInput = document.getElementById('heightInput');
const percentRange = document.getElementById('percentRange');
const downloadBtn = document.getElementById('downloadBtn');

/**
 * 当前状态
 * file 原文件；img 原图；width/height 目标尺寸
 * originUrl 原图地址；resultBlob/resultUrl 缩放结果
 */
const state = { file: null, img: null, width: 0, height: 0, originUrl: '', resultBlob: null, resultUrl: '' };
let renderTimer = null;

/**
 * 字节数格式化为 KB / MB
 */
function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

/**
 * 当前预览模式：origin 原图 / result 缩放效果
 */
function viewMode(){
  return document.querySelector('input[name="view"]:checked').value;
}

/**
 * 加载图片文件
 */
function loadFile(file){
  if(!file || !/^image\/(jpeg|png|webp)$/.test(file.type)) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    if(state.originUrl) URL.revokeObjectURL(state.originUrl);
    state.file = file;
    state.img = img;
    state.originUrl = url;
    document.getElementById('infoName').textContent = file.name;
    document.getElementById('infoName').title = file.name;
    document.getElementById('infoSize').textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
    document.getElementById('infoBytes').textContent = formatSize(file.size);
    stage.classList.add('has-image');
    document.querySelectorAll('.card input, .card button').forEach((el)=>{ el.disabled = false; });
    setSize(img.naturalWidth, img.naturalHeight);
  };
  img.onerror = ()=>{
    URL.revokeObjectURL(url);
    alert('图片读取失败');
  };
  img.src = url;
}

/**
 * 设置目标尺寸并同步界面，随后延迟生成缩放结果
 */
function setSize(width, height){
  state.width = Math.max(1, Math.min(MAX_SIDE, Math.round(width)));
  state.height = Math.max(1, Math.min(MAX_SIDE, Math.round(height)));
  const percent = Math.round(state.width / state.img.naturalWidth * 100);

  // 避免覆盖用户正在输入的框
  if(document.activeElement !== widthInput) widthInput.value = state.width;
  if(document.activeElement !== heightInput) heightInput.value = state.height;
  percentRange.value = Math.min(200, percent);
  document.getElementById('percentText').textContent = percent + '%';
  document.querySelectorAll('.chip').forEach((chip)=>{
    chip.classList.toggle('is-active', Number(chip.dataset.percent) === percent);
  });
  document.getElementById('upscaleWarn').classList.toggle('is-show', percent > 100);

  updateStage();
  // 新结果生成前禁止下载，避免下载到旧尺寸
  downloadBtn.disabled = true;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderResult, 150);
}

/**
 * 按百分比设置尺寸
 */
function setPercent(percent){
  const { naturalWidth: w, naturalHeight: h } = state.img;
  setSize(w * percent / 100, h * percent / 100);
}

/**
 * 生成缩放结果：原格式输出，JPG / WEBP 使用最高质量，不额外压缩
 */
function renderResult(){
  const { img, file, width, height } = state;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  if(file.type === 'image/jpeg'){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, width, height);
  canvas.toBlob((blob)=>{
    if(!blob) return;
    if(state.resultUrl) URL.revokeObjectURL(state.resultUrl);
    state.resultBlob = blob;
    state.resultUrl = URL.createObjectURL(blob);
    downloadBtn.disabled = false;
    updateStage();
  }, file.type, 1);
}

/**
 * 刷新预览
 * 原图与效果使用同一个显示比例（以两者中较大的尺寸适配舞台），
 * 因此缩小后效果图在预览区中也会相应变小，放大时则原图相应变小
 */
function updateStage(){
  if(!state.img) return;
  const isResult = viewMode() === 'result';
  const originW = state.img.naturalWidth;
  const originH = state.img.naturalHeight;
  const w = isResult ? state.width : originW;
  const h = isResult ? state.height : originH;

  // 舞台可用区域（扣除内边距）
  const availW = stage.clientWidth - 32;
  const availH = stage.clientHeight - 32;
  const displayScale = Math.min(1,
    availW / Math.max(originW, state.width),
    availH / Math.max(originH, state.height));

  const src = isResult && state.resultUrl ? state.resultUrl : state.originUrl;
  if(stageImg.src !== src) stageImg.src = src;
  stageImg.style.width = w * displayScale + 'px';
  stageImg.style.height = h * displayScale + 'px';

  // 效果模式且尺寸有变化时，显示原图范围虚线框
  const frame = document.getElementById('originFrame');
  const changed = state.width !== originW;
  frame.classList.toggle('is-show', isResult && changed);
  frame.style.width = originW * displayScale + 'px';
  frame.style.height = originH * displayScale + 'px';

  let text = `${isResult ? '缩放后' : '原图'} ${w} × ${h}`;
  if(isResult && state.resultBlob) text += ` · ${formatSize(state.resultBlob.size)}`;
  if(!isResult) text += ` · ${formatSize(state.file.size)}`;
  text += ` · 显示 ${Math.round(displayScale * 100)}%`;
  stageBadge.textContent = text;
}

// 窗口尺寸变化时重新计算显示比例
window.addEventListener('resize', updateStage);

/**
 * 调整尺寸时自动切到“缩放效果”视图，便于直接看到变化
 */
function showResultView(){
  document.getElementById('viewResult').checked = true;
}

// 宽度输入：高度按原图比例联动
widthInput.addEventListener('input', ()=>{
  const w = Number(widthInput.value);
  if(w > 0){
    showResultView();
    setSize(w, w * state.img.naturalHeight / state.img.naturalWidth);
  }
});

// 高度输入：宽度按原图比例联动
heightInput.addEventListener('input', ()=>{
  const h = Number(heightInput.value);
  if(h > 0){
    showResultView();
    setSize(h * state.img.naturalWidth / state.img.naturalHeight, h);
  }
});

// 失焦时把输入框恢复为实际生效的数值
[widthInput, heightInput].forEach((input)=>{
  input.addEventListener('blur', ()=>{
    widthInput.value = state.width;
    heightInput.value = state.height;
  });
});

// 百分比滑块与快捷按钮
percentRange.addEventListener('input', ()=>{
  showResultView();
  setPercent(Number(percentRange.value));
});
document.querySelectorAll('.chip').forEach((chip)=>{
  chip.onclick = ()=>{
    showResultView();
    setPercent(Number(chip.dataset.percent));
  };
});

// 切换原图 / 缩放效果
document.querySelectorAll('input[name="view"]').forEach((radio)=>{
  radio.onchange = updateStage;
});

// 重置为原尺寸
document.getElementById('resetBtn').onclick = ()=>setPercent(100);

// 下载：文件名附带新尺寸
downloadBtn.onclick = ()=>{
  if(!state.resultUrl) return;
  const ext = EXT[state.file.type] || 'png';
  const a = document.createElement('a');
  a.href = state.resultUrl;
  a.download = `${state.file.name.replace(/\.[^.]+$/, '')}-${state.width}x${state.height}.${ext}`;
  a.click();
};

// 上传：点击空状态、更换按钮、拖拽
document.getElementById('empty').onclick = ()=>fileInput.click();
document.getElementById('changeBtn').onclick = ()=>fileInput.click();
fileInput.onchange = (e)=>{
  loadFile(e.target.files[0]);
  e.target.value = '';
};
stage.addEventListener('dragover', (e)=>{
  e.preventDefault();
  stage.classList.add('is-dragover');
});
stage.addEventListener('dragleave', ()=>stage.classList.remove('is-dragover'));
stage.addEventListener('drop', (e)=>{
  e.preventDefault();
  stage.classList.remove('is-dragover');
  loadFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
