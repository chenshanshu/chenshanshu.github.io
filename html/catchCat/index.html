<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圈小猫</title>
  <style>
    :root {
      --primary: #4f6bff;
      --text: #1f2329;
      --text-2: #6b7280;
      --border: #e5e7eb;
      --bg: #f4f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      color: var(--text);
      background: var(--bg);
      font: 14px/1.6 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
    }

    /* 返回入口页 */
    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--text-2);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back:hover {
      color: var(--primary);
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .header p {
      margin: 0 0 24px;
      color: var(--text-2);
    }

    /* 左侧游戏，右侧规则 */
    .container {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 24px;
      align-items: start;
    }

    .card {
      padding: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    /* 游戏画布宽度固定，窄屏时按比例缩小（Phaser 会自动换算点击坐标） */
    #catchCat {
      display: flex;
      justify-content: center;
    }

    #catchCat canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
    }

    .rules h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .rules ol {
      margin: 0;
      padding-left: 18px;
      color: var(--text-2);
    }

    .rules li + li {
      margin-top: 8px;
    }

    @media (max-width: 760px) {
      .container {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <a class="back" href="../index.html">← 返回工具列表</a>
    <header class="header">
      <h1>圈小猫</h1>
      <p>每次点击一个圆点放下障碍，把小猫围住、别让它逃出边界</p>
    </header>

    <div class="container">
      <section class="card">
        <div id="catchCat"></div>
      </section>

      <section class="card rules">
        <h3>玩法</h3>
        <ol>
          <li>点击浅色圆点，把它变成障碍（深色）。</li>
          <li>你每放一个障碍，小猫就会走一步。</li>
          <li>小猫走到最外圈就逃跑了，你输。</li>
          <li>小猫被障碍围住无路可走，你赢。</li>
          <li>点击画布左下角的「重置」可重新开局。</li>
        </ol>
      </section>
    </div>
  </div>

  <script src="../static/phaser3.js"></script>
  <script src="./catchCat.js"></script>
  <script>
    // catchCat.js 打包后对外暴露的是 CatchTheCatGame
    window.game = new CatchTheCatGame({
      w: 11,
      h: 11,
      r: 20,
      parent: 'catchCat',
      backgroundColor: 0xffffff,
      credit: 'for chenss\'s blog'
    })
  </script>
</body>

</html>
